# Cloudflare Worker that syncs eBay listings and Google reviews into KV.
name = "taystrades-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["0 * * * *"] # every hour, on the hour

[[kv_namespaces]]
binding = "TT_KV"
id = "bbd99bb11dce4bc7a2ff4a688093e0ab" # same id as ../wrangler.toml

[observability]
enabled = true # keeps sync logs (and eBay errors) in the dashboard
